<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolalar Kiyim Do'koni</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Bolalar Kiyimlari Do'koni</h1>
        <nav>
            <a href="#kiyimlar">Kiyimlar</a>
            <a href="#aloqa">Biz bilan aloqa</a>
        </nav>
    </header>

    <main>
        <h2>Bizning Mahsulotlar</h2>
        <div id="kiyimlar" class="products">
            
            <div class="card">
                <img src="https://via.placeholder.com/150" alt="Bolalar ko'ylagi">
                <h3>Yozgi Ko'ylak</h3>
                <p>Narxi: 120 000 so'm</p>
                <button>Sotib olish</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/150" alt="Bolalar futbolkasi">
                <h3>Paxtali Futbolka</h3>
                <p>Narxi: 85 000 so'm</p>
                <button>Sotib olish</button>
            </div>

        </div>
    </main>

    <section id="aloqa">
        <h2>Buyurtma berish / Savollar uchun</h2>
        <form>
            <label for="name">Ismingiz:</label><br>
            <input type="text" id="name" name="name" placeholder="Ismingizni kiriting" required><br><br>

            <label for="phone">Telefon raqamingiz:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="+998 90 123 45 67" required><br><br>

            <label for="message">Xabar yoki buyurtma tafsiloti:</label><br>
            <textarea id="message" name="message" rows="4" placeholder="Kiyim o'lchamlari va rangini yozing..."></textarea><br><br>

            <button type="submit">Yuborish</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Bolalar kiyimlari do'koni. Barcha huquqlar himoyalangan.</p>
    </footer>

</body>
</html>
